name: dart_code_3d
description: Fly through a 3D map of a Dart code base.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  # 3.47.1 is required for the Flutter GPU switch in Linux/Windows release builds.
  flutter: ^3.47.1

dependencies:
  bloc: ^9.2.1
  code_graph:
    path: ../../packages/code_graph
  code_map_repository:
    path: ../../packages/code_map_repository
  code_source_client:
    path: ../../packages/code_source_client
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_scene:
    path: ../../packages/flutter_scene/packages/flutter_scene
  go_router: ^17.0.0
  hooks: ^2.0.0
  intl: ^0.20.2
  material_ui: ^1.1.1
  settings_repository:
    path: ../../packages/settings_repository
  shared_preferences: ^2.5.0
  vector_math: ^2.1.4

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.4.0
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.0.0
  image: ^4.5.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.0
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - flutter_scene_generated/
    - assets/samples/sample.dc3d
  # Roboto (Apache 2.0, assets/fonts/Roboto_LICENSE.txt), bundled so text looks the
  # same on every platform and in golden tests.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  generate: true
  uses-material-design: true
