name: dart_code_3d
description: Fly through a 3D map of a Dart code base.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  # 3.47.1 is required for the Flutter GPU switch in Linux/Windows release builds.
  flutter: ^3.47.1

dependencies:
  bloc: ^9.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_scene:
    path: ../../packages/flutter_scene/packages/flutter_scene
  intl: ^0.20.2
  material_ui: ^1.1.1
  vector_math: ^2.1.4

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - flutter_scene_generated/
  generate: true
  uses-material-design: true
